[env:heltec-wireless-tracker]
custom_meshtastic_hw_model = 48
custom_meshtastic_hw_model_slug = HELTEC_WIRELESS_TRACKER
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Wireless Tracker V1.1
custom_meshtastic_images = heltec-wireless-tracker.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = heltec_wireless_tracker
board_build.partitions = default_8MB.csv
upload_protocol = esptool

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec_wireless_tracker
  -D HELTEC_TRACKER_V1_1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ;-D DEBUG_DISABLED ; uncomment this line to disable DEBUG output
  ; Local build: exclude NimBLE entirely. This board's crash (firmware#5053)
  ; is specifically NimBLE init on USB-only power; this node runs over
  ; WiFi/USB serial and never used BLE, so removing it removes the trigger.
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=1

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ; The runtime WRITE_PERI_REG patch in main.cpp's setup() is too late - this
  ; unit brownout-resets in the ESP-IDF startup/bootloader path, before
  ; setup() is ever reached (observed directly: "E BOD: Brownout detector
  ; was triggered" printed at the ROM banner, looping before any app code
  ; runs). Disabling it here, in sdkconfig, takes effect from the earliest
  ; boot stage instead.
  CONFIG_ESP_BROWNOUT_DET=n

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
